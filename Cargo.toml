[package]
name = "vltview"
version = "0.2.2"
edition = "2021"
authors = ["VltView Contributors"]
description = "Terminal UI application for browsing and managing HashiCorp Vault secrets"
license = "MIT"
repository = "https://github.com/zhilinstas/vltview"
keywords = ["vault", "tui", "secrets", "hashicorp"]
categories = ["command-line-utilities"]

[dependencies]
# TUI Framework
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"

# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# Clipboard
arboard = "3.4"

# CLI Argument Parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Additional utilities
chrono = "0.4"
dirs = "5.0"
url = "2.5"
once_cell = "1.20"

# Security
zeroize = { version = "1.7", features = ["derive"] }

[dev-dependencies]
mockito = "1.5"
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
