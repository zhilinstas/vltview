[package]
name = "vltview"
version = "0.2.4"
edition = "2024"
rust-version = "1.100"
authors = ["VltView Contributors"]
description = "Terminal UI application for browsing and managing HashiCorp Vault secrets"
license = "MIT"
repository = "https://github.com/zhilinstas/vltview"
keywords = ["vault", "tui", "secrets", "hashicorp"]
categories = ["command-line-utilities"]

[dependencies]
# TUI Framework
ratatui = "0.30"
crossterm = "0.29"
ratatui-textarea = "0.9"

# Async Runtime
tokio = { version = "1.54", features = ["full"] }

# HTTP Client (rustls + aws-lc-rs, certificates verified against the OS trust store)
reqwest = { version = "0.13", features = ["json", "query", "rustls"], default-features = false }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_norway = "0.9"

# Clipboard
arboard = { version = "3.7", default-features = false }

# CLI Argument Parsing
clap = { version = "4.6", features = ["derive", "env"] }

# Error Handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Additional utilities
jiff = "1.0"
url = "2.5"

# Security
zeroize = { version = "1.9", features = ["derive"] }

[dev-dependencies]
mockito = "1.7"
# test-util: paused clock for the clipboard timeout tests
tokio = { version = "1.54", features = ["test-util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
