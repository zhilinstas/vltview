# Dev Vault with sample data. `mise run docker:up` starts it and waits for the
# seed step. The server runs in dev mode: everything is in memory, so the data
# is gone when the container is removed and is seeded again on the next start.
services:
  vault:
    image: hashicorp/vault:latest
    container_name: vltview-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-root-token-id="root"
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vltview-network

  vault-init:
    image: hashicorp/vault:latest
    container_name: vltview-vault-init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: "http://vault:8200"
      VAULT_TOKEN: "root"
    volumes:
      - ./vault-init.sh:/vault-init.sh:ro
    # The image has no bash, only busybox sh; vault-init.sh is written for it.
    # The script itself waits until Vault answers.
    entrypoint: ["/bin/sh", "/vault-init.sh"]
    networks:
      - vltview-network
    restart: "no"

networks:
  vltview-network:
    driver: bridge
