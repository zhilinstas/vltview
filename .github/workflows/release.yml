name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only by default. Only the `release` job below gets a token that can
# write, so the build jobs, which run every dependency's build script, cannot
# touch the repository or the release.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit SHA; the comment is the version that SHA is.
# To update one: gh api repos/<owner>/<repo>/git/ref/tags/<tag>

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux x86_64 (Ubuntu 22.04)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: vltview
            asset_name: vltview-linux-amd64

          # Linux x86_64 (musl for static linking)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact_name: vltview
            asset_name: vltview-linux-amd64-musl

          # macOS x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: vltview
            asset_name: vltview-macos-amd64

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: vltview
            asset_name: vltview-macos-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rust version comes from mise.toml, the same one CI tests with
      - name: Install toolchain
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: rust

      - name: Add Rust target
        run: mise exec -- rustup target add ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }}

      - name: Create tarball
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ${{ matrix.asset_name }}.tar.gz ${{ matrix.artifact_name }}
          mv ${{ matrix.asset_name }}.tar.gz ../../../

      # `shasum` is on both the Linux and the macOS runners and writes the
      # same "<hash>  <file>" format as sha256sum
      - name: Generate SHA256 checksum
        run: shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      # The files go to the release through a workflow artifact, so this job
      # needs no write access
      - name: Hand the files to the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  # One job creates the release and uploads all eight files, after every build
  # has succeeded: nothing races to create the release, and a failed build
  # leaves no half-filled release behind.
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vltview-*
          path: dist
          merge-multiple: true

      # Fails if any of the four tarballs or its checksum is missing or
      # damaged. Keep the list in step with the build matrix above.
      - name: Verify the files
        working-directory: dist
        run: |
          for asset in \
            vltview-linux-amd64 \
            vltview-linux-amd64-musl \
            vltview-macos-amd64 \
            vltview-macos-arm64
          do
            sha256sum --check "$asset.tar.gz.sha256"
          done
          ls -l

      # A tag with a hyphen (v0.3.0-rc.1) is a pre-release, which GitHub never
      # shows as the latest release. `gh release create` with files uploads
      # them to a draft and publishes it only when all of them are there.
      - name: Create the release and upload the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=false
          case "$TAG" in
            *-*) prerelease=true ;;
          esac
          gh release create "$TAG" \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            --verify-tag \
            --title "Release $TAG" \
            --generate-notes \
            --prerelease="$prerelease"
