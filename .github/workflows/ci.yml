name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Tool versions (Rust, rustfmt, clippy, cargo-audit) come from mise.toml
      - name: Install toolchain
        uses: jdx/mise-action@v5

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('mise.toml', 'Cargo.lock') }}

      - name: Check formatting
        run: mise run fmt-check

      - name: Run clippy
        run: mise run clippy

      - name: Build
        run: cargo build --locked --verbose

      - name: Run tests
        run: mise run test

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: jdx/mise-action@v5

      - name: Audit dependencies
        run: mise run audit

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install toolchain
        uses: jdx/mise-action@v5
        with:
          install_args: rust

      - name: Build release
        run: cargo build --release --locked --verbose
